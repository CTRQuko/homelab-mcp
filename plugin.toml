# Mimir plugin manifest for CTRQuko/homelab-mcp.
#
# This repo ships four sub-MCPs behind a single uv project:
#   homelab-proxmox-mcp / homelab-linux-mcp /
#   homelab-windows-mcp / homelab-docker-mcp
#
# The MVP manifest mounts only the proxmox sub-MCP, which is the most
# used in the author's deployment and the only one that hits external
# infrastructure via API. Linux / Windows / Docker still work standalone
# (`uv run homelab-{linux,windows,docker}-mcp`); a multi-manifest fan-out
# is on the TODO list when Mimir's loader supports >1 plugin.toml per
# repo (issue tracked as Fase 7d follow-up).
#
# To switch which sub-MCP this plugin runs, edit `[runtime].args` —
# every value of homelab-{proxmox,linux,windows,docker}-mcp is a valid
# entry point.

[plugin]
name = "homelab"
version = "1.0.0"
enabled = true

[runtime]
command = "uv"
args = ["run", "homelab-proxmox-mcp"]
# cwd defaults to the plugin directory (= this repo), so `uv run`
# resolves the right pyproject and venv automatically.

[security]
credential_refs = ["PROXMOX_*"]

[[requires.hosts]]
type = "proxmox"
min = 1
prompt = """
At least one Proxmox node with an API token (VM.Audit + VM.PowerMgmt)
is required. The proxmox sub-MCP reads PROXMOX_<NODE>_HOST,
PROXMOX_<NODE>_USER and PROXMOX_<NODE>_TOKEN from the env Mimir
injects.
"""

[[requires.credentials]]
pattern = "PROXMOX_*"
prompt = """
Provide one set per node. Example:
  PROXMOX_PVE1_HOST=192.0.2.10:8006
  PROXMOX_PVE1_USER=claude@pam
  PROXMOX_PVE1_TOKEN=<token-id>=<secret>
"""
